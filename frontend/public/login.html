<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — optimizedLLM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --nb-cream: #FAF7F0; --nb-white: #FFFFFF; --nb-black: #0A0A0A;
      --nb-yellow: #FFD23F; --nb-pink: #FF6B9D; --nb-lime: #C5E063;
      --nb-blue: #4A90E2; --nb-gray: #E8E4DC; --nb-muted: #6B6B6B;
    }
    * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body { font-family: 'Inter', system-ui, sans-serif; background-color: var(--nb-cream); color: var(--nb-black); }
    .font-display { font-family: 'Archivo Black', system-ui, sans-serif; letter-spacing: -0.02em; }

    .nb-btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
      border: 3px solid var(--nb-black); box-shadow: 6px 6px 0 var(--nb-black);
      padding: 0.75rem 1.5rem; font-weight: 700; font-size: 0.95rem; line-height: 1;
      background: var(--nb-white); color: var(--nb-black); cursor: pointer;
      transition: transform 80ms ease, box-shadow 80ms ease; text-decoration: none; }
    .nb-btn:hover { transform: translate(2px, 2px); box-shadow: 4px 4px 0 var(--nb-black); }
    .nb-btn:active { transform: translate(6px, 6px); box-shadow: 0 0 0 var(--nb-black); }
    .nb-btn-primary { background: var(--nb-yellow); }
    .nb-btn-dark { background: var(--nb-black); color: var(--nb-white); }
    .nb-btn-sm { padding: 0.5rem 1rem; font-size: 0.85rem; box-shadow: 4px 4px 0 var(--nb-black); }
    .nb-btn-sm:hover { box-shadow: 2px 2px 0 var(--nb-black); }

    .nb-card { background: var(--nb-white); border: 3px solid var(--nb-black); box-shadow: 6px 6px 0 var(--nb-black); }
    .nb-input { width: 100%; border: 3px solid var(--nb-black); background: var(--nb-white);
      padding: 0.85rem 1.1rem; font-size: 0.95rem; outline: none;
      transition: box-shadow 80ms ease, transform 80ms ease; }
    .nb-input:focus { box-shadow: 4px 4px 0 var(--nb-black); transform: translate(-2px, -2px); }
    .nb-input::placeholder { color: var(--nb-muted); }

    .nb-badge { display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.35rem 0.75rem; border: 2px solid var(--nb-black); background: var(--nb-white);
      font-size: 0.8rem; font-weight: 700; }

    @keyframes nb-pop { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
    .nb-animate { animation: nb-pop 0.4s cubic-bezier(0.16, 1, 0.3, 1) both; }

    ::selection { background: var(--nb-yellow); color: var(--nb-black); }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <nav class="relative z-10 mx-auto flex w-full max-w-7xl items-center justify-between px-6 py-5 md:px-10">
    <a href="/" class="flex items-center gap-2">
      <div class="flex h-10 w-10 items-center justify-center bg-nb-yellow" style="border: 3px solid var(--nb-black); box-shadow: 4px 4px 0 var(--nb-black);">
        <span class="font-display text-xl">⚡</span>
      </div>
      <span class="font-display text-xl">optimizedLLM</span>
      <span class="text-xs align-super opacity-60">®</span>
    </a>
    <div class="flex items-center gap-7">
      <a href="/models.html" class="text-sm font-semibold hover:underline underline-offset-4">Models</a>
      <a href="/" class="nb-btn nb-btn-primary text-sm">Back to home</a>
    </div>
  </nav>

  <main class="relative z-10 flex flex-1 items-center justify-center px-6 py-12">
    <div class="w-full max-w-md">
      <div class="nb-animate nb-card bg-nb-white p-8">
        <span class="nb-badge bg-nb-lime mb-4">Welcome back</span>
        <h1 class="font-display text-4xl leading-tight">Sign in</h1>
        <p class="mt-2 text-nb-muted">Continue your journey.</p>

        <form id="login-form" class="mt-8 space-y-5">
          <div>
            <label class="mb-2 block text-sm font-bold">Email</label>
            <input id="email" type="email" required autocomplete="email" class="nb-input" />
          </div>
          <div>
            <label class="mb-2 block text-sm font-bold">Password</label>
            <input id="password" type="password" required autocomplete="current-password" class="nb-input" />
          </div>

          <p id="error-msg" class="hidden border-3 p-3 text-sm font-bold" style="background: var(--nb-pink); color: var(--nb-black); border: 3px solid var(--nb-black);"></p>

          <button type="submit" id="submit-btn" class="nb-btn nb-btn-primary w-full text-base">Sign In →</button>
        </form>

        <p class="mt-6 text-center text-nb-muted">
          New here? <a href="/register.html" class="font-bold underline">Create an account</a>
        </p>
      </div>
    </div>
  </main>

  <script>
    const form = document.getElementById('login-form');
    const errorMsg = document.getElementById('error-msg');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error?.message || 'Login failed.');
        localStorage.setItem('velorah_session', JSON.stringify({ sessionId: data.session.id, userId: data.session.userId, expire: data.session.expire }));
        window.location.href = '/dashboard.html';
      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In →';
      }
    });
  </script>
</body>
</html>
