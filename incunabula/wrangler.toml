# Incunabula — Cloudflare Worker (same app as Netlify/local).
# Static: ./public served from edge. API: bundled netlify/functions.
name = "ai"
main = "worker/index.js"
compatibility_date = "2025-08-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"

[[kv_namespaces]]
binding = "MODELLAB_KV"
id = "51ffb6751cb048fcb72bad15816bb342"

[vars]

# Strongly-consistent store for the proxy destination mode. KV is eventually
# consistent, so a mode flip could not be reliably turned off across isolates;
# a single global Durable Object serialises all reads and writes instead.
[[durable_objects.bindings]]
name = "PROXY_MODE"
class_name = "ProxyMode"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ProxyMode"]
