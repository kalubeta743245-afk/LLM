# Incunabula — Cloudflare Worker (same app as Netlify/local).
# Static: ./public served from edge. API: bundled netlify/functions.
name = "ai"
main = "worker/index.js"
compatibility_date = "2025-08-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"

[[kv_namespaces]]
binding = "MODELLAB_KV"
id = "51ffb6751cb048fcb72bad15816bb342"

[vars]

# Strongly-consistent store for the proxy destination mode. KV is eventually
# consistent, so a mode flip could not be reliably turned off across isolates;
# a single global Durable Object serialises all reads and writes instead.
[[durable_objects.bindings]]
name = "PROXY_MODE"
class_name = "ProxyMode"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ProxyMode"]

# Our own request counter, replacing Cloudflare GraphQL analytics (and the
# expiring CF_API_TOKEN it needed). One instance serialises every increment so
# the counts are exact; the dashboard reads today's totals from it.
[[durable_objects.bindings]]
name = "USAGE_COUNTS"
class_name = "UsageCounts"

# Append-only: v1 above is already deployed and must not be renumbered.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["UsageCounts"]
