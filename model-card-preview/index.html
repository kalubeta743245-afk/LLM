<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NVIDIA NIM — Model Card</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script>
tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif'],mono:['JetBrains Mono','monospace']}}}}
</script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:#111113;font-family:'Inter',sans-serif;color:#fafafa;min-height:100vh;-webkit-font-smoothing:antialiased}
.spec-cell{padding:16px 20px}
.spec-cell+.spec-cell{border-top:1px solid rgba(255,255,255,0.06)}
.use-case{padding:12px 16px;border-radius:10px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.05);transition:all .2s}
.use-case:hover{background:rgba(255,255,255,0.04);border-color:rgba(255,255,255,0.08);transform:translateY(-1px)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card{animation:fadeUp .5s ease-out both}
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
<div id="root" class="w-full max-w-[540px]"></div>

<script>
const NIM='https://integrate.api.nvidia.com/v1';
const LOGOS={'nvidia':'fa-solid fa-microchip','meta':'fa-brands fa-meta','mistralai':'fa-solid fa-wind','deepseek-ai':'fa-solid fa-bolt','google':'fa-brands fa-google','microsoft':'fa-brands fa-microsoft','qwen':'fa-solid fa-globe','openai':'fa-brands fa-openai','moonshotai':'fa-solid fa-moon','z-ai':'fa-solid fa-brain','minimaxai':'fa-solid fa-minimize','stepfun-ai':'fa-solid fa-forward','ibm':'fa-solid fa-server','databricks':'fa-solid fa-database','upstage':'fa-solid fa-sun','snowflake':'fa-solid fa-snowflake','writer':'fa-solid fa-pen-fancy','zhipu':'fa-solid fa-dragon','stockmark':'fa-solid fa-chart-line','sarvamai':'fa-solid fa-language','zyphra':'fa-solid fa-robot','aisingapore':'fa-solid fa-anchor','abacusai':'fa-solid fa-square-root-variable','01-ai':'fa-solid fa-yin-yang','baai':'fa-solid fa-shield-halved','bigcode':'fa-solid fa-code','bytedance':'fa-solid fa-music','ai21labs':'fa-solid fa-book','adept':'fa-solid fa-hand-pointer','google':'fa-brands fa-google'};

function cat(id){
  const l=id.toLowerCase();
  if(l.includes('vision')||l.includes('vlm')||l.includes('fuyu')||l.includes('kosmos')||l.includes('deplot')||l.includes('vila')||l.includes('neva'))return'Vision';
  if(l.includes('code')||l.includes('coder')||l.includes('codestral'))return'Code';
  if(l.includes('embed')||l.includes('retriever'))return'Embedding';
  if(l.includes('safety')||l.includes('guard')||l.includes('reward')||l.includes('content'))return'Safety';
  if(l.includes('translate')||l.includes('riva'))return'Translation';
  return'Language';
}
function bd(t){
  const m={'Vision':'bg-cyan-500/10 text-cyan-400 border-cyan-500/20','Code':'bg-emerald-500/10 text-emerald-400 border-emerald-500/20','Embedding':'bg-rose-500/10 text-rose-400 border-rose-500/20','Safety':'bg-orange-500/10 text-orange-400 border-orange-500/20','Translation':'bg-blue-500/10 text-blue-400 border-blue-500/20','Language':'bg-violet-500/10 text-violet-400 border-violet-500/20'};
  return m[t]||m.Language;
}
function fmt(ts){return new Date(ts*1e3).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'})}
function sz(id){
  const m=id.match(/(\d+\.?\d*)[bB]/);
  if(m){const n=parseFloat(m[1]);return n>=50?'70B+':n>=13?'13B-49B':'1B-12B'}
  if(id.includes('ultra')||id.includes('max')||id.includes('super')||id.includes('maverick'))return'70B+';
  if(id.includes('mini')||id.includes('nano')||id.includes('small')||id.includes('tiny'))return'1B-12B';
  return'—';
}

function render(m){
  const p=m.id.split('/')[0];
  const short=m.id.split('/')[1]||m.id;
  const c=cat(m.id);
  const b=bd(c);
  const s=sz(m.id);
  const logo=LOGOS[p]||'fa-solid fa-cube';
  const idShort=m.id.replace(/^[^/]+\//,'');

  const uses=[
    {icon:'fa-comments',text:'Conversational AI & chatbots',clr:'text-emerald-400'},
    {icon:'fa-file-lines',text:'Content generation & analysis',clr:'text-blue-400'},
    {icon:'fa-code',text:'Code generation & assistance',clr:'text-violet-400'},
    {icon:'fa-brain',text:'Reasoning & problem-solving',clr:'text-amber-400'},
  ];

  return `<div class="card w-full bg-[#1a1a1c] rounded-2xl overflow-hidden border border-white/[0.06]" style="box-shadow:0 0 0 1px rgba(0,0,0,0.3),0 8px 40px rgba(0,0,0,0.4)">
    <div class="px-6 pt-6 pb-5 border-b border-white/[0.06]">
      <div class="flex items-start justify-between mb-3">
        <div class="flex items-center gap-3">
          <div class="w-11 h-11 rounded-xl bg-[#262628] flex items-center justify-center border border-white/[0.06]"><i class="${logo} text-[15px] text-white/50"></i></div>
          <div>
            <p class="text-[12px] font-medium text-white/40">${p}</p>
            <h1 class="text-[20px] font-bold text-white tracking-[-0.015em] leading-tight">${short}</h1>
          </div>
        </div>
        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-[11px] font-medium border ${b}">${c}</span>
      </div>
      <p class="text-[13px] text-white/40 leading-relaxed">NVIDIA NIM inference microservice. Production-ready model accessed via OpenAI-compatible API endpoint.</p>
    </div>

    <div class="border-b border-white/[0.06]">
      <div class="spec-cell">
        <p class="text-[11px] text-white/25 uppercase tracking-wider mb-1">Model ID</p>
        <p class="text-[13px] font-mono text-white/70">${m.id}</p>
      </div>
      <div class="spec-cell">
        <p class="text-[11px] text-white/25 uppercase tracking-wider mb-1">Owner</p>
        <p class="text-[13px] font-medium text-white/70">${p}${m.owned_by&&m.owned_by!==p?' · '+m.owned_by:''}</p>
      </div>
      <div class="flex">
        <div class="flex-1 spec-cell">
          <p class="text-[11px] text-white/25 uppercase tracking-wider mb-1">Size</p>
          <p class="text-[13px] font-medium text-white/70">${s}</p>
        </div>
        <div class="flex-1 spec-cell" style="border-left:1px solid rgba(255,255,255,0.06)">
          <p class="text-[11px] text-white/25 uppercase tracking-wider mb-1">Released</p>
          <p class="text-[13px] font-medium text-white/70">${fmt(m.created||Date.now()/1e3)}</p>
        </div>
      </div>
    </div>

    <div class="px-6 py-5 border-b border-white/[0.06]">
      <p class="text-[11px] text-white/25 uppercase tracking-wider mb-3">Capabilities</p>
      <div class="grid grid-cols-2 gap-2">
        ${uses.map(u=>`<div class="use-case flex items-center gap-2.5 text-[12px] text-white/50"><i class="fa-solid ${u.icon} ${u.clr} text-[11px]"></i>${u.text}</div>`).join('')}
      </div>
    </div>

    <div class="px-6 py-4 border-b border-white/[0.06]">
      <div class="flex items-center justify-between mb-2">
        <p class="text-[11px] text-white/25 uppercase tracking-wider">API Reference</p>
        <span class="text-[10px] text-white/20 font-mono">curl</span>
      </div>
      <div class="bg-black/40 rounded-lg px-4 py-3 border border-white/[0.04]">
        <code class="text-[12px] font-mono text-white/40 leading-relaxed block whitespace-nowrap overflow-x-auto">curl ${NIM}/chat/completions \<br>  -H "Authorization: Bearer $KEY" \<br>  -H "Content-Type: application/json" \<br>  -d '{"model":"${idShort}","messages":[{"role":"user","content":"Hello"}]}'</code>
      </div>
    </div>

    <div class="px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-emerald-400 shadow-[0_0_6px_rgba(52,211,153,0.4)]"></span>
        <span class="text-[12px] text-white/35 font-medium">Available</span>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="copyModel()" id="copy-btn" class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-lg bg-white/[0.04] hover:bg-white/[0.07] border border-white/[0.06] text-[12px] text-white/50 hover:text-white/70 transition-all duration-200 font-medium"><i class="fa-regular fa-copy text-[11px]"></i>Copy ID</button>
        <button onclick="next()" class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-lg bg-white text-[#1a1a1c] hover:bg-white/90 text-[12px] font-semibold transition-all duration-200"><i class="fa-solid fa-arrow-right text-[11px]"></i>Next</button>
      </div>
    </div>
  </div>`;
}

let allModels=[];
async function init(){
  const root=document.getElementById('root');
  root.innerHTML=`<div class="flex flex-col items-center gap-4 py-12"><div class="w-8 h-8 border-2 border-white/10 border-t-white/50 rounded-full animate-spin"></div><p class="text-[13px] text-white/30">Loading NVIDIA NIM catalog..</p></div>`;
  try{
    const r=await fetch(NIM+'/models');
    if(!r.ok)throw new Error();
    allModels=(await r.json()).data||[];
  }catch(e){
    allModels=[{id:'nvidia/llama-3.1-nemotron-70b-instruct',created:1720000000,owned_by:'nvidia'}];
  }
  showRandom();
}
function showRandom(){
  const m=allModels[Math.floor(Math.random()*allModels.length)];
  document.getElementById('root').innerHTML=render(m);
}
function next(){
  const card=document.querySelector('.card');
  if(card){card.style.transition='opacity .15s,transform .15s';card.style.opacity='0';card.style.transform='scale(0.97)'}
  setTimeout(showRandom,180);
}
function copyModel(){
  const btn=document.getElementById('copy-btn');
  navigator.clipboard.writeText(allModels[Math.floor(Math.random()*allModels.length)].id).then(()=>{
    btn.innerHTML='<i class="fa-solid fa-check text-[11px] text-emerald-400"></i>Copied';
    setTimeout(()=>btn.innerHTML='<i class="fa-regular fa-copy text-[11px]"></i>Copy ID',1500);
  });
}
init();
</script>
</body>
</html>
