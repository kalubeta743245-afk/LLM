[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "src/public"

# Serve _headers and _redirects as static files, not through the function
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

# API routes MUST bypass static file serving (force = true)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

# All other routes go through the Express serverless function
# Netlify serves static files from publish/ first, then applies redirects
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api"
  status = 200
