[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "src/public"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/*"
  status = 200

[[redirects]]
  from = "/v1/*"
  to = "/.netlify/functions/api/v1/*"
  status = 200

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/health"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
