<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — Galaxy LLM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body{font-family:'Inter',sans-serif;background-color:#003144;color:#fff;-webkit-font-smoothing:antialiased}
        .liquid-glass{background:rgba(255,255,255,0.01);background-blend-mode:luminosity;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border:none;box-shadow:inset 0 1px 1px rgba(255,255,255,0.1);position:relative;overflow:hidden}
        .liquid-glass::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.4px;background:linear-gradient(180deg,rgba(255,255,255,0.45) 0%,rgba(255,255,255,0.15) 20%,rgba(255,255,255,0) 40%,rgba(255,255,255,0) 60%,rgba(255,255,255,0.15) 80%,rgba(255,255,255,0.45) 100%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
        @keyframes fade-rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
        .animate-fade-rise{animation:fade-rise .8s ease-out both}
        .auth-input{background:rgba(255,255,255,0.04);border:1px solid hsl(0 0% 18%);color:#fff}
        .auth-input:focus{outline:none;border-color:hsl(240 4% 66%)}
        .key-row{border-bottom:1px solid hsl(0 0% 18%)}
        .key-row:last-child{border-bottom:none}
    </style>
</head>
<body class="min-h-screen flex flex-col bg-black" style="background-image:url('https://source.unsplash.com/random/1920x1080/?nebula,cosmic');background-size:cover;background-blend-mode:overlay">
    <div class="absolute inset-0 bg-black/70 -z-10"></div>
    <nav class="relative z-10 mx-auto flex max-w-7xl w-full flex-row items-center justify-between px-8 py-6">
        <a href="/" class="text-3xl tracking-tight text-white" style="font-family:'Instrument Serif',serif">Galaxy LLM<sup class="text-xs">®</sup></a>
        <div class="flex items-center gap-4">
            <span id="user-email" class="hidden text-sm" style="color:hsl(240 4% 66%)"></span>
            <button id="logout-btn" class="liquid-glass rounded-full px-5 py-2 text-sm text-white transition-transform hover:scale-[1.03]">Sign Out</button>
        </div>
    </nav>

    <main class="relative z-10 flex-1 px-6 pb-16 pt-8 mx-auto w-full max-w-5xl animate-fade-rise">
        <h1 class="text-4xl tracking-tight text-white" style="font-family:'Instrument Serif',serif">Dashboard</h1>

        <div id="auth-gate" class="hidden mt-12 text-center">
            <p class="text-sm" style="color:hsl(240 4% 66%)">Please sign in to view your dashboard.</p>
            <a href="/login.html" class="liquid-glass inline-block mt-6 rounded-full px-6 py-2.5 text-sm text-white transition-transform hover:scale-[1.03]">Sign In</a>
        </div>

        <div id="dashboard-content" class="hidden mt-10 space-y-8">
            <div class="liquid-glass rounded-2xl p-6">
                <h2 class="text-lg font-medium text-white">Account Overview</h2>
                <div id="summary" class="mt-4 grid grid-cols-3 gap-4 text-center"></div>
            </div>

            <div class="liquid-glass rounded-2xl p-6">
                <div class="flex items-center justify-between">
                    <h2 class="text-lg font-medium text-white">API Keys</h2>
                    <button id="create-key-btn" class="liquid-glass rounded-full px-5 py-2 text-sm text-white transition-transform hover:scale-[1.03]">+ New Key</button>
                </div>
                <div id="create-key-form" class="hidden mt-4">
                    <div class="flex gap-3">
                        <input id="new-key-name" type="text" placeholder="Key name" class="auth-input flex-1 rounded-full px-4 py-2 text-sm" />
                        <button id="create-key-submit" class="liquid-glass rounded-full px-5 py-2 text-sm text-white transition-transform hover:scale-[1.03]">Create</button>
                        <button id="create-key-cancel" class="rounded-full px-4 py-2 text-sm" style="color:hsl(240 4% 66%)">Cancel</button>
                    </div>
                    <p id="key-created-msg" class="hidden mt-3 text-sm font-mono break-all" style="color:#34d399"></p>
                </div>
                <div id="keys-list" class="mt-4"></div>
                <p id="no-keys" class="hidden mt-4 text-sm" style="color:hsl(240 4% 66%)">No API keys yet. Create one to get started.</p>
            </div>
        </div>
    </main>

    <script>
        const session = JSON.parse(localStorage.getItem('velorah_session') || 'null');
        const gate = document.getElementById('auth-gate');
        const content = document.getElementById('dashboard-content');
        const emailSpan = document.getElementById('user-email');

        if (!session?.userId) {
            gate.classList.remove('hidden');
        } else {
            content.classList.remove('hidden');
            emailSpan.classList.remove('hidden');
            loadDashboard();
        }

        document.getElementById('logout-btn').addEventListener('click', async () => {
            try { await fetch('/api/auth/logout', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ userId: session.userId }) }); } catch (_) {}
            localStorage.removeItem('velorah_session');
            window.location.href = '/login.html';
        });

        async function loadDashboard() {
            try {
                const res = await fetch('/api/dashboard', { headers: { 'X-User-Id': session.userId } });
                if (!res.ok) throw new Error('Failed');
                const data = await res.json();
                render(data);
            } catch (e) {
                document.getElementById('keys-list').innerHTML = '<p class="text-sm" style="color:#f87171">Failed to load dashboard.</p>';
            }
        }

        function render(data) {
            if (data.user?.email) emailSpan.textContent = data.user.email;

            const s = data.summary || {};
            document.getElementById('summary').innerHTML = [
                { label: 'API Keys', value: s.totalKeys ?? 0 },
                { label: 'Credits Left', value: s.totalCredits ?? 0 },
                { label: 'Credits Used', value: s.totalUsed ?? 0 },
            ].map(c => `<div class="rounded-xl p-4" style="background:rgba(255,255,255,0.03)"><div class="text-2xl text-white">${c.value}</div><div class="text-xs mt-1" style="color:hsl(240 4% 66%)">${c.label}</div></div>`).join('');

            const keys = data.keys || [];
            const listEl = document.getElementById('keys-list');
            const noKeys = document.getElementById('no-keys');

            if (keys.length === 0) {
                noKeys.classList.remove('hidden');
                listEl.innerHTML = '';
                return;
            }
            noKeys.classList.add('hidden');
            listEl.innerHTML = keys.map(k => `
                <div class="key-row flex items-center justify-between py-3 gap-4 flex-wrap">
                    <div class="flex-1 min-w-0">
                        <div class="text-sm text-white truncate">${esc(k.name)}</div>
                        <div class="text-xs font-mono mt-1 truncate" style="color:hsl(240 4% 66%)">${esc(k.key)}</div>
                    </div>
                    <div class="text-sm" style="color:hsl(240 4% 66%)">${k.credits ?? 0} / ${k.totalCredits ?? 0} credits</div>
                    <button data-key-id="${k.id}" class="delete-key-btn rounded-full px-3 py-1 text-xs transition-colors" style="color:#f87171;border:1px solid rgba(248,113,113,0.3)">Delete</button>
                </div>
            `).join('');

            listEl.querySelectorAll('.delete-key-btn').forEach(btn => {
                btn.addEventListener('click', async () => {
                    if (!confirm('Delete this API key?')) return;
                    btn.textContent = '...';
                    btn.disabled = true;
                    await fetch(`/api/dashboard/keys/${btn.dataset.keyId}`, { method: 'DELETE', headers: { 'X-User-Id': session.userId } });
                    loadDashboard();
                });
            });
        }

        function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

        const createBtn = document.getElementById('create-key-btn');
        const createForm = document.getElementById('create-key-form');
        const createSubmit = document.getElementById('create-key-submit');
        const createCancel = document.getElementById('create-key-cancel');
        const createdMsg = document.getElementById('key-created-msg');
        const nameInput = document.getElementById('new-key-name');

        createBtn.addEventListener('click', () => { createForm.classList.remove('hidden'); createBtn.classList.add('hidden'); nameInput.focus(); });
        createCancel.addEventListener('click', () => { createForm.classList.add('hidden'); createBtn.classList.remove('hidden'); createdMsg.classList.add('hidden'); });
        createSubmit.addEventListener('click', async () => {
            const name = nameInput.value.trim() || 'New Key';
            createSubmit.disabled = true; createSubmit.textContent = 'Creating...';
            try {
                const res = await fetch('/api/dashboard/keys', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-User-Id': session.userId }, body: JSON.stringify({ name }) });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error?.message || 'Failed');
                nameInput.value = '';
                createdMsg.textContent = `Key created: ${data.key}`;
                createdMsg.classList.remove('hidden');
                loadDashboard();
            } catch (e) { alert(e.message); }
            createSubmit.disabled = false; createSubmit.textContent = 'Create';
        });
    </script>
</body>
</html>
