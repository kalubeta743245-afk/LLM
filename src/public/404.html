<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>404 — optimizedLLM</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500&display=swap" rel="stylesheet"><style>:root{--bg-deep:#080b14;--bg-elevated:rgba(255,255,255,0.05);--accent:#6366f1;--accent-purple:#a855f7;--text:#f1f5f9;--text-secondary:#94a3b8;--text-muted:#64748b;--border:rgba(255,255,255,0.06);--glass-bg:rgba(255,255,255,0.03);--glass-border:rgba(255,255,255,0.08);--glass-shadow:0 8px 32px rgba(0,0,0,0.5)}body{font-family:'Inter',sans-serif;background:var(--bg-deep);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden}.liquid-glass{background:var(--glass-bg);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--glass-border);box-shadow:var(--glass-shadow);position:relative;overflow:hidden}@keyframes fade-rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}.animate-fade-rise{animation:fade-rise .8s ease-out both}.animate-fade-rise-delay{animation:fade-rise .8s ease-out .2s both}.animate-fade-rise-delay-2{animation:fade-rise .8s ease-out .4s both}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}@keyframes glow-pulse{0%,100%{text-shadow:0 0 40px rgba(99,102,241,0.3)}50%{text-shadow:0 0 80px rgba(99,102,241,0.6)}}.float{animation:float 6s ease-in-out infinite}.glow-pulse{animation:glow-pulse 3s ease-in-out infinite}.bg-gradient-anim{background:linear-gradient(135deg,var(--bg-deep) 0%,#1a0a2e 25%,var(--bg-deep) 50%,#0d1b2a 75%,var(--bg-deep) 100%);background-size:400% 400%;animation:gradient-shift 15s ease infinite}@keyframes gradient-shift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:0;animation:twinkle 3s ease-in-out infinite}@keyframes twinkle{0%,100%{opacity:0}50%{opacity:0.8}}.search-404{background:var(--bg-elevated);border:1px solid var(--border);color:var(--text);width:100%;max-width:320px;border-radius:9999px;padding:10px 20px;font-size:14px;transition:border-color .2s}.search-404:focus{outline:none;border-color:var(--accent)}.search-404::placeholder{color:var(--text-muted)}</style></head><body class="min-h-screen flex flex-col bg-gradient-anim"><div id="stars" class="fixed inset-0 z-0 pointer-events-none"></div>
<nav class="relative z-10 mx-auto flex max-w-7xl w-full flex-row items-center justify-between px-8 py-6"><a href="/" class="text-3xl tracking-tight text-white" style="font-family:'Instrument Serif',serif">optimizedLLM<sup class="text-xs align-super" style="color:var(--text-muted)">®</sup></a><a href="/" class="liquid-glass rounded-full px-6 py-2.5 text-sm text-white transition-all duration-200 hover:scale-[1.03] hover:bg-white/5">Back to Home</a></nav>
<main class="relative z-10 flex-1 flex flex-col items-center justify-center px-6 text-center"><div class="animate-fade-rise"><div class="text-[10rem] md:text-[14rem] font-bold leading-none tracking-tighter float glow-pulse" style="font-family:'Instrument Serif',serif;background:linear-gradient(135deg,var(--accent),var(--accent-purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">404</div><p class="mt-4 text-lg" style="color:var(--text-secondary)">This page is lost in space.</p><p class="mt-1 text-sm" style="color:var(--text-muted)">Let's get you back on course.</p></div>
<div class="mt-8 flex flex-col sm:flex-row items-center gap-4 animate-fade-rise-delay"><input id="search-input" type="text" placeholder="Search models..." class="search-404"/><a href="/models.html" class="liquid-glass rounded-full px-6 py-2.5 text-sm text-white transition-all duration-200 hover:scale-[1.03] hover:bg-white/5">Browse Models</a></div>
<div class="mt-10 flex items-center gap-6 animate-fade-rise-delay-2"><a href="/" class="text-sm transition-colors" style="color:var(--text-secondary);hover:color:var(--text)">Home</a><a href="/docs.html" class="text-sm transition-colors" style="color:var(--text-secondary);hover:color:var(--text)">Docs</a><a href="/pricing.html" class="text-sm transition-colors" style="color:var(--text-secondary);hover:color:var(--text)">Pricing</a><a href="/login.html" class="text-sm transition-colors" style="color:var(--text-secondary);hover:color:var(--text)">Sign In</a></div></main>
<script>var starsEl=document.getElementById('stars');for(var i=0;i<80;i++){var star=document.createElement('div');star.className='star';star.style.left=Math.random()*100+'%';star.style.top=Math.random()*100+'%';star.style.animationDelay=Math.random()*3+'s';star.style.animationDuration=(2+Math.random()*3)+'s';starsEl.appendChild(star)}
